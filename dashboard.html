<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الحساب - كوين الخليج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
<div class="brand">كوين الخليج</div>
<nav>
<ul class="nav-links" id="nav-links">
<li><a href="index.html">الرئيسية</a></li>
<li><a href="#" id="logoutBtn">تسجيل الخروج</a></li>
</ul>
<button class="menu-toggle" id="menu-toggle">☰</button>
</nav>
</header>
<main>
<div class="dashboard">
<div class="info-row">
<div class="info-card glass3d">
<h4>الاسم</h4>
<p id="clientName">--</p>
</div>
<div class="info-card glass3d">
<h4>الرصيد</h4>
<p id="clientBalance">0 USD</p>
</div>
</div>
<div class="info-row">
<div class="info-card glass3d">
<h4>الهاتف</h4>
<p id="clientPhone">--</p>
</div>
<div class="info-card glass3d">
<h4>البريد الإلكتروني</h4>
<p id="clientEmail">--</p>
</div>
</div>
<div class="actions">
<button class="btn-green" id="depositBtn">إيداع</button>
<button class="btn" id="withdrawBtn">سحب</button>
</div>
<h3>سجل العمليات</h3>
<table class="tx-table glass3d">
<thead>
<tr>
<th>النوع</th>
<th>المبلغ</th>
<th>التاريخ</th>
<th>الحالة</th>
</tr>
</thead>
<tbody id="txBody">
<tr><td colspan="4">لا توجد معاملات بعد</td></tr>
</tbody>
</table>
</div>
</main>

<!-- مودال السحب والإيداع كما كان موجود -->

<footer class="site-footer glass">
<div class="footer-content">© 2025 كوين الخليج — جميع الحقوق محفوظة</div>
</footer>
<script type="module" src="script.js"></script>
</body>
</html>
