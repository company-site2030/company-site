<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الحساب - كوين الخليج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">كوين الخليج</div>
  <button id="logoutBtn">تسجيل الخروج</button>
</header>
<main>
  <h3>معلومات العميل</h3>
  <p>الاسم: <span id="clientName"></span></p>
  <p>البريد الإلكتروني: <span id="clientEmail"></span></p>
  <p>الهاتف: <span id="clientPhone"></span></p>
  <p>الرصيد: <span id="clientBalance"></span></p>

  <button id="depositBtn">إيداع</button>
  <button id="withdrawBtn">سحب</button>

  <h3>سجل العمليات</h3>
  <table>
    <thead><tr><th>النوع</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th></tr></thead>
    <tbody id="txBody"><tr><td colspan="4">لا توجد معاملات بعد</td></tr></tbody>
  </table>
</main>

<!-- مودال الإيداع -->
<div id="depositModal" class="hidden">
  <h3>إيداع</h3>
  <p>قم بتحويل USDT إلى: <code id="depositAddress">0x7F8125C197B845E1F0682A9846B94A11cA9d9743</code></p>
  <input id="depositAmount" type="number" placeholder="0.00">
  <button id="confirmDeposit">تأكيد الإيداع</button>
  <button id="closeDeposit">إغلاق</button>
</div>

<!-- مودال السحب -->
<div id="withdrawModal" class="hidden">
  <h3>سحب</h3>
  <input id="withdrawAmount" type="number" placeholder="0.00">
  <select id="withdrawMethod">
    <option value="" selected disabled>اختر</option>
    <option value="bank">حساب بنكي</option>
    <option value="crypto">محفظة USDT</option>
  </select>
  <div id="bankFields" class="hidden">
    <input id="bankName" placeholder="اسم البنك">
    <input id="iban" placeholder="رقم الآيبان">
  </div>
  <div id="cryptoFields" class="hidden">
    <input id="usdtAddress" placeholder="العنوان">
  </div>
  <button id="confirmWithdraw">تأكيد السحب</button>
  <button id="closeWithdraw">إغلاق</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
